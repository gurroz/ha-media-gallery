name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  attach-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # HACS looks for a release asset matching the "filename" in hacs.json before
      # falling back to dist/ in the tagged tree.
      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/ha-media-gallery.js --clobber
